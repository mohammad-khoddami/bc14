<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .container {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      grid-template-columns: repeat(6, 1fr);
      height: 100vh;
    }
    .box1 {
      grid-area: 1/1/2/6;
      background-color: rgb(150, 201, 243);
    }
    .box2 {
      grid-area: 2/1/5/2;
      background-color: rgb(226, 159, 212);
    }
    .box3 {
      grid-area: 2/2/5/5;
      background-color: rgb(231, 228, 231);
    }
    .box4 {
      grid-area: 2/5/5/6;
      background-color: rgb(233, 164, 100);
    }
    .box5 {
      grid-area: 5/1/6/6;
      background-color: rgb(173, 191, 224);
    }
    @media all and (min-width: 481px) and (max-width: 768px) {
      .container {
        grid-template-rows: repeat(7, 1fr);
        grid-template-columns: repeat(2, 1fr);
      }
      .box1 {
        grid-area: 1/1/2/3;
      }
      .box2 {
        grid-area: 2/1/5/2;
      }
      .box3 {
        grid-area: 5/1/7/3;
      }
      .box4 {
        grid-area: 2/2/5/3;
      }
      .box5 {
        grid-area: 7/1/8/3;
        background-color: rgb(173, 191, 224);
      }
    }

    @media all and (min-width: 768px) {
      .container {
        grid-template-rows: repeat(10, 1fr);
        grid-template-columns: repeat(1, 1fr);
      }
      .box1 {
        grid-area: 1/1/2/2;
      }
      .box2 {
        grid-area: 2/1/4/2;
      }
      .box3 {
        grid-area: 4/1/8/2;
      }
      .box4 {
        grid-area: 8/1/10/2;
      }
      .box5 {
        grid-area: 10/1/11/2;
      }
    }
  </style>
  <body>
    <div class="container">
      <div class="box1"></div>
      <div class="box2"></div>
      <div class="box3"></div>
      <div class="box4"></div>
      <div class="box5"></div>
    </div>
  </body>
</html>
